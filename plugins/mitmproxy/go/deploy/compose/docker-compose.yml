# Personal single-node deploy — NOT multi-tenant / NOT cloud sync.
# Default publishes to localhost only. For LAN, change ports carefully and
# put access_control / firewall in front. Do not expose 0.0.0.0 publicly
# without understanding that the control API can read all captures.
services:
  proxying:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-compose}
    image: proxying:local
    container_name: proxying
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080" # MITM proxy
      - "127.0.0.1:9090:9090" # API + UI
    volumes:
      - proxying-data:/data
    healthcheck:
      test: ["CMD", "/proxying", "-version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  proxying-data:
