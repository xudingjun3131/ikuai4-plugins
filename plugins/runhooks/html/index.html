<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>巡流 NetLoom · 局域网流量观测台</title>
    <script src="../../static/js/vue.js"></script>
    <script src="../../static/js/plugin.js"></script>
    <script src="../../static/js/element.js"></script>
    <link rel="stylesheet" href="../../static/css/plugin.css">
    <link rel="stylesheet" href="../../static/css/element.css">
    <style>
/* ===== 巡流 NetLoom · 插件页布局优化 (v1.1.8-ui2, 2026-11-20) =====
   承接固件插件管理页重设计: 12/16 紧凑节奏、分区头层次、状态 chips 化、
   长说明收敛为可展开信息条、表单栅格等宽对齐。
   只重做视觉层, 不动任何 DOM 结构 / Vue 绑定 / 方法 / 文案 / 后端动作。
   遵守 plugin-page-ui.md 硬规范: 灰底 + 白卡浮起(8px 圆角/描边/阴影)、
   16px 内距契约、tab 纯 HTML+Vue、启停单按钮、引擎未启动 iframe 门控,
   不改 #app 与 .box 的滚动语义及已验收的上下灰条。 */
:root{
  --nl-bg:#e9edf4;--nl-card:#fff;--nl-line:#d8dfe9;--nl-soft:#ebeef5;
  --nl-ink:#303133;--nl-sub:#606266;--nl-mute:#909399;
  --nl-primary:#409eff;--nl-primary-soft:#ecf5ff;--nl-ok:#67c23a;
  --nl-warn:#e6a23c;--nl-bad:#f56c6c;--nl-r:8px;
}
/* [no-gap] 详情页铺满 iframe: 去掉四周灰底与白卡边角, 不留上下左右灰色间隙。
   内容内距保留(白底, 不是灰边); 用户 2026-11-20 明确要求去掉灰色间隙,
   覆盖旧的「灰底 + 白卡浮起」口径。 */
body{background:#fff!important;padding:0!important;margin:0!important;color:var(--nl-ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
#app.wrapper.row>.box{padding:0!important;margin:0!important;background:#fff;border:0;}
#app .box_block{padding:0!important;margin:0!important;background:#fff;}
#app .box_block>.margin_phone{
  background:#fff;border:0!important;border-radius:0!important;box-shadow:none!important;
  padding:12px 16px 14px;margin:0!important;}
#app .h20{height:0!important;margin:8px 0;}

/* 头部: 标题左 / 状态右, 状态组收成一条 pill, 分隔线更轻 */
.nl-header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  padding-bottom:10px;border-bottom:1px solid var(--nl-soft);}
.nl-header>div:first-child b{font-size:17px;letter-spacing:.5px;color:var(--nl-ink);}
.nl-header>div:first-child span{display:block;font-size:12px;color:var(--nl-mute);margin-top:3px;padding-left:0!important;}
.nl-status{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap;
  background:#f7f9fc;border:1px solid var(--nl-soft);border-radius:20px;padding:4px 9px;}
#app .el-tag{border-radius:11px;height:22px;line-height:20px;margin:0;}
.nl-status>span[style]{font-size:12px;color:var(--nl-sub);padding:2px 9px;background:#fff;
  border:1px solid var(--nl-soft);border-radius:11px;}

/* 操作区: 标签+按钮成组, 长说明作为次要信息常显 */
.nl-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;}
.nl-actions .rq-group-label{font-size:12px;font-weight:700;color:var(--nl-primary);
  background:var(--nl-primary-soft);border-radius:6px;padding:4px 10px;}
.nl-actions-hint{flex-basis:100%;font-size:11px!important;color:var(--nl-mute)!important;line-height:1.6;order:9;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:1.7em;transition:max-height .2s;}
.nl-actions-hint:hover{max-height:160px;white-space:normal;}
#app .btn{height:30px!important;line-height:28px;padding:0 14px!important;margin:0!important;
  border-radius:6px!important;font-size:12px;transition:.15s;white-space:nowrap;}
#app .btn_default{background:#fff;border:1px solid #dcdfe6;color:var(--nl-sub);cursor:pointer;}
#app .btn_default:hover{background:var(--nl-primary-soft);border-color:#3e8cd4;color:#3e8cd4;}
#app .btn_blue{background:var(--nl-primary);border-color:var(--nl-primary);color:#fff;}
#app .btn_green{background:var(--nl-ok);border-color:var(--nl-ok);color:#fff;}
#app .btn_red{background:var(--nl-bad);border-color:var(--nl-bad);color:#fff;}
#app .btn:disabled{opacity:.5;cursor:not-allowed;}

/* 次要区「服务与端口」常展开: 卡片化, 端口行的长说明同样收敛 */
.rq-service{margin-top:10px;border:1px solid var(--nl-soft);border-radius:var(--nl-r);background:#fafbfc;overflow:hidden;}
.rq-service-body{padding:10px 13px 12px;background:#fff;}
#app .rq-service-body .runhooks-row>span[style*="color:#909399"]{flex-basis:100%;font-size:11px!important;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#app .rq-service-body .runhooks-row>span[style*="color:#909399"]:hover{white-space:normal;}

/* 提示条: 通用紧凑信息卡, 说明全文直接展示 */
.runhooks-tip{background:#f7f9fc;border:1px solid var(--nl-soft);border-left:3px solid var(--nl-primary);
  border-radius:6px;padding:8px 12px;font-size:11px;color:var(--nl-sub);line-height:1.7;margin-top:10px;}
.runhooks-tip>b{color:var(--nl-ink);}

/* 分区头: 与固件页 sec_head 同节奏(标题 + 左侧主色条 + 下方细分隔) */
.rq-group-label{font-size:12px;color:var(--nl-primary);font-weight:700;}
.nl-section-label{display:block;margin:12px 0 8px;padding-left:9px;border-left:3px solid var(--nl-primary);
  font-size:14px;font-weight:700;color:var(--nl-ink);letter-spacing:.3px;}

/* tab: 纯 HTML+Vue, 选中态明确, 面板内距与卡片对齐 */
.rq-tabs{display:flex;gap:2px;margin-top:8px;border-bottom:1px solid var(--nl-soft);flex-wrap:wrap;}
.rq-tab{padding:7px 13px;font-size:12px;color:var(--nl-sub);cursor:pointer;user-select:none;
  border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;white-space:nowrap;transition:.15s;}
.rq-tab:hover{color:var(--nl-primary);background:#f7f9fc;}
.rq-tab.on{color:var(--nl-primary);background:#fff;border-color:var(--nl-soft);font-weight:700;position:relative;top:1px;}
.rq-tab b{font-weight:400;color:var(--nl-mute);padding-left:2px;}
.rq-tabpanel{border:1px solid var(--nl-soft);border-top:none;border-radius:0 0 var(--nl-r) var(--nl-r);
  padding:12px 14px;background:#fff;}

/* 表单栅格: 统一行距 / label 宽 / 控件高度与聚焦态, 消除散装内联 */
#app .runhooks-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;}
#app .runhooks-row>label:not(.el-checkbox){min-width:80px!important;font-size:12px;color:var(--nl-sub);font-weight:500;}
#app .runhooks-row input:not([type=checkbox]):not([type=radio]),
#app .runhooks-row select{height:30px!important;border:1px solid #dcdfe6!important;
  border-radius:6px!important;padding:0 10px!important;font-size:12px!important;color:var(--nl-ink);
  background:#fff;outline:none;transition:.15s;box-sizing:border-box;}
#app .runhooks-row input:focus,#app .runhooks-row select:focus{border-color:var(--nl-primary)!important;
  box-shadow:0 0 0 2px rgba(64,158,255,.15);}
#app .runhooks-row input::placeholder{color:#c0c4cc;}
#app .runhooks-row>span[style*="color:#909399"]{font-size:11px!important;color:var(--nl-mute)!important;}

/* 设备列表: 行分隔 + 等宽 IP, 像一张表 */
.runhooks-devices{max-height:190px;overflow-y:auto;border:1px solid var(--nl-soft);border-radius:6px;padding:4px 10px;background:#fcfcfd;}
.runhooks-device-item{display:flex;align-items:center;gap:10px;padding:5px 4px;font-size:12px;border-bottom:1px dashed var(--nl-soft);}
.runhooks-device-item:last-child{border-bottom:none;}
.runhooks-device-item .ip{color:var(--nl-mute);font-family:ui-monospace,Menlo,Consolas,monospace;}
.runhooks-device-item>span:nth-child(2){font-weight:600;color:var(--nl-ink);min-width:120px;}

/* 订阅卡片: 内联浅灰底收敛为白卡 + 描边, 明细列表左距统一 */
.rq-tabpanel>div[style*="border:1px solid #ebeef5"]{border-radius:var(--nl-r)!important;
  box-shadow:0 1px 4px rgba(31,45,61,.04);background:#fff!important;}
#app .rq-tabpanel div[style*="background:#fafafa"]{background:#fff!important;}
.rq-tabpanel ul{margin:2px 0 0 14px!important;}

/* 观测台 iframe 与离线空态: 配置区更紧凑后多给观测台高度 */
/* [ui-consolidate] 工具栏精简 + 设置弹窗化后, 观测台拿回整页高度 */
.runhooks-frame{width:100%;height:calc(100vh - 32px);min-height:640px;border:1px solid var(--nl-line);
  border-radius:var(--nl-r);display:block;background:#fff;box-shadow:0 2px 12px rgba(31,45,61,.06);}
.runhooks-frame.is-full{position:fixed;inset:0;width:100vw;height:100vh;min-height:0;border:0;border-radius:0;z-index:9000;}
/* [platform-fullscreen] 全屏态去掉插件页四周留白与卡片边角, 观测台贴边铺满 */
body.platform-fullscreen{padding:0!important;background:#fff!important;}
body.platform-fullscreen #app.wrapper.row>.box,
body.platform-fullscreen .box_block>.margin_phone{padding:0!important;margin:0!important;
  border:0!important;border-radius:0!important;box-shadow:none!important;}
/* [fs-exit-not-over-ca] 退出全屏按钮不能压在观测台顶部 ribbon 右侧的
   「CA 证书」按钮上(v1.1.17 实锤: ribbon 高 66px, CA 按钮 y=16..48)。
   挪到右下角、footer(y>=727)之上, 避开 ribbon/deck/foot 三处功能区。 */
/* 精简后的一行工具条 */
.nl-actions{min-height:30px;align-items:center;}
.nl-actions .rq-tip{font-size:11px;color:var(--nl-mute);}
.rq-offline .btn{margin:0 4px;}
.rq-offline{margin-top:10px;padding:20px;text-align:center;color:var(--nl-mute);font-size:12px;line-height:1.8;
  background:#fafbfc;border:1px dashed var(--nl-line);border-radius:var(--nl-r);}

/* 保留原有辅助类(既有测试脚本按这些选择器断言) */
.rq-collapsible{cursor:pointer;user-select:none;display:flex;align-items:center;gap:5px;}
.rq-caret{font-style:normal;font-size:11px;color:var(--nl-mute);transition:transform .15s;display:inline-block;}
.rq-caret.open{transform:rotate(90deg);}
.runhooks-card{border:1px solid var(--nl-soft);border-radius:var(--nl-r);padding:16px;margin-top:10px;background:#fff;}

/* 滚动条 */
#app ::-webkit-scrollbar{width:8px;height:8px;}
#app ::-webkit-scrollbar-thumb{background:#c8d0dc;border-radius:8px;}

/* 窄屏: 状态组与操作组各自换行 */
@media (max-width:1100px){
  .nl-header{align-items:flex-start;}
  .nl-status{justify-content:flex-start;}
}
/* ===== [horiz-tabs] 横向(左右排列) tab: 7 项一行排开, 内容面板在下方;
   框选的「服务与端口」+「使用说明」与五段配置同为 tab 项, 不再在顶部独占空间;
   整个设置区只保留外层白卡一层边角, 内层不再各自带框 ===== */
.nl-split{display:block;margin-top:10px;border-top:1px solid var(--nl-soft);}
.nl-tabs{display:flex;flex-direction:row;flex-wrap:wrap;gap:2px;padding:8px 0 0;
  background:transparent;border-bottom:1px solid var(--nl-soft);}
.nl-tab{padding:7px 13px;font-size:12px;color:var(--nl-sub);cursor:pointer;user-select:none;
  border-radius:6px 6px 0 0;border-bottom:3px solid transparent;white-space:nowrap;transition:.15s;}
.nl-tab:hover{color:var(--nl-primary);background:#eef4fd;}
.nl-tab.on{color:var(--nl-primary);background:#fff;border-bottom-color:var(--nl-primary);font-weight:700;}
.nl-tab b{font-weight:400;color:var(--nl-mute);padding-left:2px;}
.nl-panel{padding:12px 0 0;min-width:0;background:#fff;}
/* 内部块一律去边框/圆角/阴影: 只剩外层白卡一层边角, 消除多层套娃边角 */
.nl-panel .rq-tabpanel{border:0!important;border-radius:0!important;background:transparent!important;
  padding:0!important;box-shadow:none!important;}
.nl-panel .rq-service{border:0!important;background:transparent!important;border-radius:0!important;
  box-shadow:none!important;overflow:visible!important;margin-top:0!important;}
.nl-panel .rq-service-body{border:0!important;background:transparent!important;padding:0 0 4px!important;}
.nl-panel .runhooks-tip{border:0!important;border-left:3px solid var(--nl-primary)!important;
  border-radius:0!important;box-shadow:none!important;background:#f7f9fc;}
/* 使用说明面板里完整显示步骤, 不再折叠省略 */
.nl-panel .nl-pane>.runhooks-tip,.nl-panel .nl-pane .runhooks-tip{white-space:normal!important;
  max-height:none!important;overflow:visible!important;text-overflow:clip!important;}
/* 窄屏: tab 自动换行, 面板仍在下方 */
@media (max-width:820px){
  .nl-tabs{gap:2px;}
  .nl-tab{padding:6px 9px;}
}
@media (max-width:820px){
  .nl-header{flex-direction:column;}
  .nl-actions-hint{order:0;}
  #app .runhooks-row>label:not(.el-checkbox){min-width:100%;}
}
    </style>
</head>
<body>
<div id="app" class="wrapper row" v-loading="loading" :element-loading-text="loading_text">
    <div class="box clearfix">
        <div class="box_block">
            <div class="clearfix margin_phone">
                <!-- [v1.1.30] 设置与使用说明已整体迁入观测台「运维工具箱 → 设置」页。
                     本页不再渲染设置弹窗; 所有配置读写经 postMessage 桥接
                     (settings-request / settings-apply / settings-action, 见 methods)。
                     引擎未启动时的离线按钮改走 openSettings(): 先拉起引擎再深链到工具箱设置页。 -->

                <!-- [iKuaiPatch] 引擎未启动时 apiPort 无监听, iframe 会渲染出 Chromium
                     的「xxx 拒绝了我们的连接请求」错误页; 用户要求"要么隐藏, 不要出现
                     这个提示"。故整块(含上下间距)只在引擎运行时出现。 -->
                <!-- [ui-slim] 正常态外层只剩 iframe: 状态/按钮全在观测台 WebUI 里。
                     退出全屏由 WebUI ribbon 的全屏切换按钮(或 ESC)完成, 不再有浮动按钮。 -->
                <iframe v-if="status === 1" class="runhooks-frame" :class="{'is-full': fullscreen}" :src="uiUrl"></iframe>
                <!-- 引擎未启动时 WebUI 没加载, 必须留最小启动/设置入口, 运行后本行消失 -->
                <div v-else class="rq-offline">
                    引擎未启动，观测台暂不可用。
                    <button type="button" class="btn btn_green rounded height26" @click="setCapture(true)">开启抓包(自动启动引擎)</button>
                    <button type="button" class="btn btn_default rounded height26" @click="openSettings()">设置</button>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="module">
// [platform-fullscreen] 插件页被嵌了两层: SPA -> 02.pgstore 页 -> 本插件页。
// 只提升 window.frameElement(最内层) 仍会露出平台顶栏/左侧菜单 = 4 条边缘空隙。
// 必须沿 window.parent 链把每一层 iframe 都提升到各自父文档的整个视口, 才能
// 真正铺满平台。position:fixed + 四边归零 + width/height:100%(相对父文档视口;
// iframe 是 replaced element, 用 auto 会退回默认 300x150), 退出时按原 style 逐层恢复。
let __frameStyles = null;
function frameChain() {
    const out = [];
    let w = window;
    try {
        while (w.frameElement) { out.push(w.frameElement); w = w.parent; }
    } catch (e) { /* 跨域: 停在能访问的最外层 */ }
    return out;
}
function setFrameFullscreen(on) {
    const frames = frameChain();
    if (on) {
        if (__frameStyles === null) __frameStyles = frames.map(function(f) { return f.getAttribute('style') || ''; });
        frames.forEach(function(f) {
            [['position','fixed'],['top','0'],['left','0'],['right','0'],['bottom','0'],
             ['width','100%'],['height','100%'],['margin','0'],['border','0'],
             ['z-index','99999'],['background','#fff']].forEach(function(kv) {
                f.style.setProperty(kv[0], kv[1], 'important');
            });
        });
    } else if (__frameStyles !== null) {
        frames.forEach(function(f, i) { f.setAttribute('style', __frameStyles[i] || ''); });
        __frameStyles = null;
    }
    // 插件页自身四周留白也在全屏态去掉, 观测台 iframe 真正贴边
    try { document.body.classList.toggle('platform-fullscreen', !!on); } catch (e) {}
}

var app = new Vue({
    el: '#app',
    data: {
        loading: false,
        loading_text: '',
        status: 0, capture: 0, rulesOn: 0, autostart: 0, caok: 0, flows: 0,
        // autostart 同时用于复选框 v-model(0/1) 和 set_auto_start 传参(true/false)
        proxyPort: 18060, apiPort: 18061, transparentPort: 18062, geoLoaded: 0, inWindow: 0, enginePaused: 0, proxyReady: 0,
        uiUrl: '', caUrl: '',
        // 布局折叠态: 2/3/4 是高级筛选, 默认收起省屏幕; 第1段抓包设备始终展开
        activeTab: 'service',
        // [tab-init] 首次 show 数据回来时按引擎状态落一次 tab: 停止态落在「服务与端口」
        // 保证「启动引擎」一步可点, 运行态落在「观测设备」; 之后用户手动切换不再被覆盖。
        tabInitDone: false,
        // [one-page] 配置区是否展开 / 观测台是否在本页内全屏(不是新窗口)
        settingsOpen: false, fullscreen: false,
        // 设备
        lanDevices: [], selectedDevices: [], groups: [],
        manualIp: '', manualMac: '', manualName: '', groupName: '',
        // 网络范围
        interfaces: '', ports: '80,443',
        schedEnabled: false, schedStart: '09:00', schedStop: '18:00',
        schedDays: [1, 2, 3, 4, 5],
        weekDays: [{v:1,n:'一'},{v:2,n:'二'},{v:3,n:'三'},{v:4,n:'四'},{v:5,n:'五'},{v:6,n:'六'},{v:7,n:'日'}],
        // 解密范围
        domainMode: 'all_except', domains: '', dstIpMode: 'all_except', dstIps: '',
        geoMode: 'off', countries: '',
        // 记录范围
        recordMode: 'all_except', paths: '', methods: '', userAgents: '', ja3: '',
        contentTypes: '', sizeMin: '', sizeMax: '',
        // 规则订阅
        subs: [], subEffective: null, subEngine: false,
        subUrl: '', subName: '', subFormat: 'auto', subInterval: 0,
        subDetail: null, subBusy: false
    },
    computed: {
        // [capture-pause] 三态: 总开关关=抓包已关; 开着但引擎暂停(WebUI 里点过暂停)=
        // 已暂停; 否则抓包中。以前只有两态, 引擎暂停时页面仍显示"抓包中"却一条不记。
        captureTag() {
            if (this.capture !== 1) return { type: 'info', text: '抓包已关' };
            if (this.enginePaused === 1) return { type: 'warning', text: '已暂停(引擎)' };
            return { type: 'danger', text: '抓包中' };
        }
    },
    mounted() {
        // [plugin-proxy] 新固件(proxyReady=1): iframe 走同源 /plugin_proxy/runhooks/
        // (OpenResty 校验 sess_key 后转发, 自动带登录 cookie, HTTPS 页也不再拦 mixed-content);
        // 旧固件回退直连 http://IP:端口(升级固件后自动收紧)
        this.uiUrl = this.proxyReady
            ? '/plugin_proxy/runhooks/'
            : 'http://' + window.location.hostname + ':' + this.apiPort + '/';
        this.caUrl = 'http://' + window.location.hostname + ':' + this.apiPort + '/api/ca.pem';
        this.loadInitData();
        this.loadDevices();
        // [one-page] ESC 退出「本页内全屏」, 与浏览器全屏习惯一致
        window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && this.fullscreen) this.setFullscreen(false); });
        // [ui-consolidate] 观测台 WebUI 里的操作入口经 postMessage 回到插件页执行。
        // 只接受本页 iframe 发来的消息(e.source 校验), 动作白名单固定, 不接任意方法名。
        window.addEventListener('message', (e) => {
            const f = document.querySelector('.runhooks-frame');
            if (!f || e.source !== f.contentWindow) return;
            const m = e.data || {};
            if (m.__netloom !== 1) return;
            switch (m.action) {
                case 'fullscreen': this.setFullscreen(true); break;
                case 'exit-fullscreen': this.setFullscreen(false); break;
                case 'capture': this.setCapture(!!m.on); break;
                case 'refresh': this.loadInitData(); break;
                // [v1.1.30] 设置入口不再是弹窗, 而是切到观测台工具箱的设置页。
                case 'settings': this.openSettings(); break;
                case 'state-request': this.postState(); break;
                case 'settings-request': this.postSettings(); break;
                case 'settings-apply': this.applySettingsSection(m.section, m.values); break;
                case 'settings-action': this.runSettingsAction(m.name, m.args); break;
            }
        });
    },
    watch: {
        // 插件层状态变了就推给 WebUI, 让 ribbon 按钮显示正确的开关态
        status() { this.postState(); },
        capture() { this.postState(); },
        fullscreen() { this.postState(); },
        settingsOpen() { this.postState(); },
        rulesOn() { this.postState(); },
        caok() { this.postState(); },
        flows() { this.postState(); },
        enginePaused() { this.postState(); }
    },
    methods: {
        // [ui-consolidate] 把插件层状态推给观测台 iframe(只能由 WebUI 主动请求或
        // 状态变化时推送; targetOrigin 用 * 是因为旧固件下 iframe 是 http://IP:端口,
        // 与外层 HTTPS 页不同源, 但接收方只认 window.parent 且只取白名单字段)。
        postState() {
            const f = document.querySelector('.runhooks-frame');
            if (!f || !f.contentWindow) return;
            try {
                f.contentWindow.postMessage({
                    __netloom: 1, type: 'state',
                    status: this.status, capture: this.capture,
                    rulesOn: this.rulesOn, caok: this.caok,
                    flows: this.flows, enginePaused: this.enginePaused,
                    fullscreen: this.fullscreen, settingsOpen: this.settingsOpen
                }, '*');
            } catch (e) { /* iframe 尚未就绪, 等 state-request */ }
        },
        setFullscreen(on) {
            this.fullscreen = !!on;
            setFrameFullscreen(!!on);
        },
        // [v1.1.30] 设置迁移: 把插件层配置快照推给观测台 iframe(工具箱设置页)。
        // 字段白名单固定, 不接受任意键名; iframe 未就绪时静默跳过, WebUI 挂载后会主动请求。
        postSettings() {
            const f = document.querySelector('.runhooks-frame');
            if (!f || !f.contentWindow) return;
            const settings = {
                status: this.status, autostart: this.autostart,
                proxyPort: this.proxyPort, apiPort: this.apiPort, transparentPort: this.transparentPort,
                geoLoaded: this.geoLoaded, inWindow: this.inWindow,
                lanDevices: this.lanDevices || [], selectedDevices: this.selectedDevices || [], groups: this.groups || [],
                interfaces: this.interfaces, ports: this.ports,
                schedEnabled: this.schedEnabled, schedStart: this.schedStart, schedStop: this.schedStop,
                schedDays: this.schedDays || [], weekDays: this.weekDays || [],
                domainMode: this.domainMode, domains: this.domains,
                dstIpMode: this.dstIpMode, dstIps: this.dstIps,
                geoMode: this.geoMode, countries: this.countries,
                recordMode: this.recordMode, paths: this.paths, methods: this.methods,
                userAgents: this.userAgents, ja3: this.ja3, contentTypes: this.contentTypes,
                sizeMin: this.sizeMin, sizeMax: this.sizeMax,
                subs: this.subs || [], subEffective: this.subEffective || null,
                subEngine: this.subEngine, subDetail: this.subDetail || null, subBusy: this.subBusy
            };
            try { f.contentWindow.postMessage({__netloom: 1, type: 'settings', settings: settings}, '*'); } catch (e) {}
        },
        // [v1.1.30] 引擎未启动时 iframe 不渲染(会显示连接拒绝错误页), 所以先拉起引擎,
        // 再用 hash 深链把已加载的观测台切到工具箱设置页(React 侧监听 hashchange)。
        openSettings() {
            const base = (this.uiUrl || '').split('#')[0];
            this.uiUrl = base + '#tool=settings';
            this.settingsOpen = false;
            if (this.status !== 1) this.setCapture(true);
            this.setFullscreen(true);
        },
        // [v1.1.30] 工具箱设置页的「保存」: section + values 都走白名单, 复用原有 Vue 方法,
        // 不新增固件 API 调用路径。apply 后各 save 方法内部会 loadInitData -> postSettings 回填。
        applySettingsSection(section, values) {
            const v = values || {};
            const put = (keys) => keys.forEach(k => { if (Object.prototype.hasOwnProperty.call(v, k)) this[k] = v[k]; });
            switch (section) {
                case 'autostart': put(['autostart']); this.setAutostart(); break;
                case 'ports': put(['proxyPort', 'apiPort', 'transparentPort']); this.savePorts(); break;
                case 'devices': put(['selectedDevices']); this.saveDevices(); break;
                case 'group': put(['groupName']); this.saveGroup(); break;
                case 'network': put(['interfaces', 'ports']); this.saveNetwork(); break;
                case 'schedule': put(['schedEnabled', 'schedStart', 'schedStop', 'schedDays']); this.saveSchedule(); break;
                case 'scope':
                    put(['domainMode', 'domains', 'dstIpMode', 'dstIps', 'geoMode', 'countries',
                         'recordMode', 'paths', 'methods', 'userAgents', 'ja3', 'contentTypes',
                         'sizeMin', 'sizeMax']);
                    this.saveScope(); break;
                case 'sub-add': put(['subUrl', 'subName', 'subFormat', 'subInterval']); this.addSub(); break;
            }
        },
        // [v1.1.30] 工具箱设置页的即时动作: 名称白名单, 参数只取固定键。
        runSettingsAction(name, args) {
            const a = args || {};
            switch (name) {
                case 'refresh-devices': this.loadDevices(); break;
                case 'add-manual':
                    this.manualIp = a.ip || ''; this.manualMac = a.mac || ''; this.manualName = a.name || '';
                    this.addManualAndSave(); break;
                case 'remove-selected': this.removeSelected(Number(a.index) || 0); break;
                case 'toggle-device': this.toggleDevice(a.device || {}); this.saveDevices(); break;
                case 'save-devices': this.saveDevices(); break;
                case 'apply-group': { const g = (this.groups || []).find(x => x.name === a.name); if (g) this.applyGroup(g); break; }
                case 'del-group': this.delGroup(a.name || ''); break;
                case 'set-days': this.setDays(a.preset || 'all'); break;
                case 'geoip-update': this.updateGeoip(); break;
                case 'subs-load': this.loadSubs(); break;
                case 'sub-update': { const x = (this.subs || []).find(y => y.id === a.id); if (x) this.updateSub(x); break; }
                case 'sub-toggle': { const x = (this.subs || []).find(y => y.id === a.id); if (x) this.toggleSub(x); break; }
                case 'sub-del': { const x = (this.subs || []).find(y => y.id === a.id); if (x) this.delSub(x); break; }
                case 'sub-detail': { const x = (this.subs || []).find(y => y.id === a.id); if (x) this.showSubDetail(x); break; }
            }
        },
        // [v1.1.8] 图形化断点改包工作台: 用 hash 深链把已打开的观测台 iframe
        // 切到工具箱的 rewrite 页(React 侧监听 hashchange), 不重载、不新开窗口。
        openRewrite() {
            const base = (this.uiUrl || '').split('#')[0];
            this.uiUrl = base + '#tool=rewrite';
            this.settingsOpen = false;
            this.setFullscreen(true);
        },
        // [param-b64] 框架 /Action/call 的参数值禁止包含 引号/空格/$/&/;/|/\ 等
        // 字符(ikngx.lua __rest_check_illegality_char), JSON.stringify 的字符串
        // 含双引号必被拒(2005 Invalid characters)——曾导致保存设备/范围/分组/时段
        // 全部静默失败(用户实踩: 设备列表始终空、抓不到包)。改 base64 传输
        // (仅含 [A-Za-z0-9+/=] 全合法), 后端 base64 -d 解码;
        // unescape(encodeURIComponent()) 保证中文设备名安全。
        b64enc(str) { return btoa(unescape(encodeURIComponent(str))); },
        callPlugin(action, param, cb) {
            AjaxPost('/Action/call', {func_name: 'plugin_runhooks', action: action, param: param}, (response) => {
                cb(response);
            });
        },
        loadInitData() {
            this.callPlugin('show', {TYPE: 'data'}, (response) => {
                if (response.Result % 10000 == 0 && response.Data) {
                    const d = response.Data;
                    this.status = d.status || 0;
                    if (!this.tabInitDone) {
                        this.activeTab = (this.status === 1) ? 'devices' : 'service';
                        this.tabInitDone = true;
                    }
                    this.capture = d.capture || 0;
                    this.rulesOn = d.rulesOn || 0;
                    this.autostart = d.autostart || 0;
                    this.caok = d.caok || 0;
                    this.flows = d.flows || 0;
                    this.enginePaused = d.enginePaused || 0;
                    this.geoLoaded = d.geoLoaded || 0;
                    this.inWindow = d.inWindow || 0;
                    if (d.proxyPort) this.proxyPort = d.proxyPort;
                    if (d.apiPort) this.apiPort = d.apiPort;
                    if (d.transparentPort) this.transparentPort = d.transparentPort;
                    if (d.proxyReady !== undefined) this.proxyReady = d.proxyReady;
                    // [plugin-proxy] 同上: proxyReady=1 走同源代理路径(带鉴权), 否则直连
                    this.uiUrl = this.proxyReady
                        ? '/plugin_proxy/runhooks/'
                        : 'http://' + window.location.hostname + ':' + this.apiPort + '/';
                    this.caUrl = 'http://' + window.location.hostname + ':' + this.apiPort + '/api/ca.pem';
                    // 配置回填
                    this.selectedDevices = d.devices || [];
                    this.groups = d.groups || [];
                    this.interfaces = d.interfaces || '';
                    this.ports = d.ports || '80,443';
                    const sc = d.scope || {};
                    this.domainMode = sc.domain_mode || 'all_except';
                    this.domains = (sc.domains || []).join(',');
                    this.dstIpMode = sc.dst_ip_mode || 'all_except';
                    this.dstIps = (sc.dst_ips || []).join(',');
                    this.geoMode = sc.geo_mode || 'off';
                    this.countries = (sc.countries || []).join(',');
                    this.recordMode = sc.record_mode || 'all_except';
                    this.paths = (sc.paths || []).join(',');
                    this.methods = (sc.methods || []).join(',');
                    this.userAgents = (sc.user_agents || []).join(',');
                    this.ja3 = (sc.ja3 || []).join(',');
                    this.contentTypes = (sc.content_types || []).join(',');
                    this.sizeMin = sc.size_min || '';
                    this.sizeMax = sc.size_max || '';
                    const sd = d.schedule || {};
                    this.schedEnabled = !!sd.enabled;
                    this.schedStart = sd.start || '09:00';
                    this.schedStop = sd.stop || '18:00';
                    this.schedDays = sd.days || [1, 2, 3, 4, 5];
                }
                this.postSettings();
            });
        },
        // 在线设备双源合并: dhcp_lease(DHCP客户端, 带主机名) + arp(ARP表)。
        // [bugfix] 手动配了静态 IP/网关的设备不进 DHCP 租约, 只在 ARP 表里——
        // 单源 dhcp_lease 会导致静态设备在列表里"获取不到"(用户实际踩中)。
        // 另修: 原来直接赋 response.Data(是 {data:[...]} 对象不是数组),
        // v-for 遍历对象 + length===0 永不成立, 列表根本渲染不对。
        loadDevices() {
            AjaxPost('/Action/call', {func_name: 'dhcp_lease', action: 'show', param: {TYPE: 'data'}}, (r1) => {
                AjaxPost('/Action/call', {func_name: 'arp', action: 'show', param: {}}, (r2) => {
                    const pick = (r) => (r.Result % 10000 == 0 && r.Data && Array.isArray(r.Data.data)) ? r.Data.data : [];
                    const a1 = pick(r1);
                    // arp 表含 WAN 侧条目(管理网), 按 tagname 过滤掉(wan1_xxx 形态)
                    const a2 = pick(r2).filter(d => !/^wan\d/i.test(d.tagname || ''));
                    const seen = {}, out = [];
                    a1.concat(a2).forEach(d => {
                        const ip = d.ip_addr;
                        if (!ip || seen[ip]) return;
                        seen[ip] = 1;
                        if (!d.hostname && d.comment) d.hostname = d.comment;
                        out.push(d);
                    });
                    this.lanDevices = out;
                    this.postSettings();
                });
            });
        },
        isSelected(d) {
            return this.selectedDevices.some(s => (d.mac && s.mac === d.mac) || (d.ip_addr && s.ip === d.ip_addr));
        },
        // [iKuaiPatch] 标签云的 ✕ 专用: 按索引直接删, 并立即落盘。
        // 不能复用 toggleDevice(d)——它按 lanDevices 的字段(ip_addr/termname/hostname)
        // 匹配, 而 selectedDevices 的条目是 {ip,mac,name}, 字段名不同导致 findIndex
        // 恒为 -1, 于是走 else 分支又 push 一个空条目(用户实踩: 点✕越点越多)。
        removeSelected(i) {
            this.selectedDevices.splice(i, 1);
            this.saveDevices();
        },
        toggleDevice(d) {
            const idx = this.selectedDevices.findIndex(s => (d.mac && s.mac === d.mac) || (d.ip_addr && s.ip === d.ip_addr));
            if (idx >= 0) {
                this.selectedDevices.splice(idx, 1);
            } else {
                this.selectedDevices.push({ip: d.ip_addr, mac: d.mac, name: d.termname || d.hostname || ''});
            }
        },
        addManualAndSave() {
            this.addManual(); this.saveDevices();
        },
        addManual() {
            if (!this.manualIp) { this.$message.error('请填 IP'); return; }
            this.selectedDevices.push({ip: this.manualIp, mac: this.manualMac, name: this.manualName});
            this.manualIp = ''; this.manualMac = ''; this.manualName = '';
        },
        // 引擎端口保存(改端口后端会重启引擎)
        savePorts() {
            this.callPlugin('set_proxy_ports', {
                proxy: this.proxyPort, api: this.apiPort, transparent: this.transparentPort
            }, (response) => {
                if (response.Result % 10000 == 0) {
                    this.$message.success('端口已保存, 引擎已重启');
                    this.loadInitData();
                } else {
                    this.$message.error('保存失败：' + (response.ErrMsg || '未知错误'));
                }
            });
        },
        saveDevices() {
            this.callPlugin('set_devices', {devices_b64: this.b64enc(JSON.stringify(this.selectedDevices))}, (response) => {
                if (response.Result % 10000 == 0) {
                    this.$message.success('设备已保存(' + this.selectedDevices.length + ' 台)');
                    this.loadInitData();
                } else {
                    this.$message.error('保存失败：' + (response.ErrMsg || '未知错误'));
                }
            });
        },
        saveGroup() {
            if (!this.groupName) { this.$message.error('请填分组名'); return; }
            this.callPlugin('save_group', {name_b64: this.b64enc(this.groupName), devices_b64: this.b64enc(JSON.stringify(this.selectedDevices))}, (response) => {
                if (response.Result % 10000 == 0) {
                    this.$message.success('分组已保存');
                    this.groupName = '';
                    this.loadInitData();
                } else {
                    this.$message.error('保存失败：' + (response.ErrMsg || '未知错误'));
                }
            });
        },
        applyGroup(g) {
            this.selectedDevices = JSON.parse(JSON.stringify(g.devices));
            this.saveDevices();
        },
        delGroup(name) {
            this.callPlugin('del_group', {name_b64: this.b64enc(name)}, () => this.loadInitData());
        },
        saveNetwork() {
            this.callPlugin('set_ports', {ports: this.ports}, () => {
                this.callPlugin('set_interfaces', {ifaces: this.interfaces}, (response) => {
                    if (response.Result % 10000 == 0) {
                        this.$message.success('网络范围已保存');
                    } else {
                        this.$message.error('保存失败：' + (response.ErrMsg || '未知错误'));
                    }
                });
            });
        },
        setDays(preset) {
            if (preset === 'all') this.schedDays = this.weekDays.map(d => d.v);
            else if (preset === 'work') this.schedDays = this.weekDays.filter(d => d.v <= 5).map(d => d.v);
            else this.schedDays = this.weekDays.filter(d => d.v >= 6).map(d => d.v);
        },
        saveSchedule() {
            const sched = {
                enabled: this.schedEnabled,
                start: this.schedStart,
                stop: this.schedStop,
                days: this.schedDays
            };
            this.callPlugin('set_schedule', {schedule_b64: this.b64enc(JSON.stringify(sched))}, (response) => {
                if (response.Result % 10000 == 0) {
                    this.$message.success('时段已保存');
                    this.loadInitData();
                } else {
                    this.$message.error('保存失败：' + (response.ErrMsg || '未知错误'));
                }
            });
        },
        splitList(s) {
            return (s || '').split(',').map(x => x.trim()).filter(x => x);
        },
        saveScope() {
            const scope = {
                domain_mode: this.domainMode,
                domains: this.splitList(this.domains),
                dst_ip_mode: this.dstIpMode,
                dst_ips: this.splitList(this.dstIps),
                geo_mode: this.geoMode,
                countries: this.splitList(this.countries).map(x => x.toUpperCase()),
                record_mode: this.recordMode,
                paths: this.splitList(this.paths),
                methods: this.splitList(this.methods).map(x => x.toUpperCase()),
                user_agents: this.splitList(this.userAgents),
                ja3: this.splitList(this.ja3),
                content_types: this.splitList(this.contentTypes),
                size_min: parseInt(this.sizeMin) || 0,
                size_max: parseInt(this.sizeMax) || 0
            };
            this.callPlugin('set_scope', {scope_b64: this.b64enc(JSON.stringify(scope))}, (response) => {
                if (response.Result % 10000 == 0) {
                    this.$message.success('范围已保存并热重载');
                } else {
                    this.$message.error('保存失败：' + (response.ErrMsg || '未知错误'));
                }
            });
        },
        downloadCa() {
            // [混合内容修复] 页面是HTTPS, 直链引擎http端口会被浏览器拦(一闪而过)。
            // 改走同源 show&TYPE=ca 取base64, 本地Blob下载
            this.callPlugin('show', {TYPE: 'ca'}, (response) => {
                const d = (response && (response.Data || response.results)) || {};
                if (!d.ca_b64) { alert('CA 尚未生成, 请先启动引擎'); return; }
                try {
                    const bin = atob(d.ca_b64);
                    const buf = new Uint8Array(bin.length);
                    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
                    const blob = new Blob([buf], {type: 'application/x-pem-file'});
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'netloom-ca.pem';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                } catch (e) { alert('CA 下载失败: ' + e); }
            });
        },
        updateGeoip() {
            this.loading = true;
            this.loading_text = '正在下载 GEOIP 数据...';
            this.callPlugin('update_geoip', {}, (response) => {
                this.loading = false;
                if (response.Result % 10000 == 0) {
                    this.$message.success('GEOIP 数据已更新');
                    this.loadInitData();
                } else {
                    this.$message.error('更新失败：' + (response.ErrMsg || '请检查网络'));
                }
            });
        },
        startEngine() {
            this.callPlugin('start', {}, (response) => {
                if (response.Result % 10000 == 0) {
                    this.$message.success('引擎已启动');
                    this.loadInitData();
                } else {
                    this.$message.error('启动失败：' + (response.ErrMsg || '未知错误'));
                }
            });
        },
        stopEngine() {
            this.callPlugin('stop', {}, (response) => {
                if (response.Result % 10000 == 0) {
                    this.$message.success('引擎已停止, 规则已撤');
                    this.loadInitData();
                } else {
                    this.$message.error('停止失败：' + (response.ErrMsg || '未知错误'));
                }
            });
        },
        setAutostart() {
            this.callPlugin('set_auto_start', {autostart: this.autostart ? 'true' : 'false'}, (response) => {
                if (response.Result % 10000 == 0) {
                    this.$message.success(this.autostart ? '已开启开机自启' : '已关闭开机自启');
                } else {
                    this.$message.error('设置失败：' + (response.ErrMsg || '未知错误'));
                }
            });
        },
        setCapture(on) {
            this.callPlugin('set_capture', {capture: on ? 'true' : 'false'}, (response) => {
                if (response.Result % 10000 == 0) {
                    this.$message({message: on ? '抓包已开启' : '抓包已关闭', type: 'success'});
                    this.loadInitData();
                } else {
                    this.$message.error('操作失败：' + (response.ErrMsg || '未知错误'));
                }
            });
        },
        clearFlows() {
            this.callPlugin('clear_flows', {}, (response) => {
                if (response.Result % 10000 == 0) {
                    this.$message({message: '已清空', type: 'success'});
                    this.loadInitData();
                } else {
                    this.$message.error('清空失败：' + (response.ErrMsg || '未知错误'));
                }
            });
        },
        // ===== 规则订阅 =====
        fmtSubTime(ts) {
            if (!ts) return '从未';
            const d = new Date(ts * 1000);
            const p = (n) => String(n).padStart(2, '0');
            return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
        },
        loadSubs() {
            this.callPlugin('show', {TYPE: 'subs'}, (response) => {
                if (response.Result % 10000 == 0 && response.Data) {
                    const d = response.Data;
                    // 引擎空数组可能回 null(Go nil slice), 归一成 [] 防模板 .length 崩
                    this.subs = d.subs || [];
                    this.subEffective = d.effective || null;
                    if (this.subEffective) {
                        this.subEffective.domains = this.subEffective.domains || [];
                        this.subEffective.dst_ips = this.subEffective.dst_ips || [];
                        this.subEffective.countries = this.subEffective.countries || [];
                        this.subEffective.paths = this.subEffective.paths || [];
                        this.subEffective.user_agents = this.subEffective.user_agents || [];
                    }
                    this.subEngine = d.engine === true;
                } else {
                    this.subs = [];
                    this.subEffective = null;
                    this.subEngine = false;
                }
                this.postSettings();
            });
        },
        addSub() {
            if (!this.subUrl) return;
            this.subBusy = true;
            this.callPlugin('sub_add', {
                url_b64: this.b64enc(this.subUrl),
                name_b64: this.b64enc(this.subName || ''),
                format: this.subFormat,
                interval_min: String(this.subInterval || 0)
            }, (response) => {
                this.subBusy = false;
                if (response.Result % 10000 == 0) {
                    this.$message({message: '订阅已添加并生效', type: 'success'});
                    this.subUrl = ''; this.subName = '';
                    this.loadSubs();
                } else {
                    this.$message.error('添加失败：' + (response.ErrMsg || '未知错误'));
                }
            });
        },
        delSub(s) {
            this.subBusy = true;
            this.callPlugin('sub_del', {id: s.id}, (response) => {
                this.subBusy = false;
                if (response.Result % 10000 == 0) {
                    this.$message({message: '订阅已删除', type: 'success'});
                    if (this.subDetail && this.subDetail.id === s.id) this.subDetail = null;
                    this.loadSubs();
                } else {
                    this.$message.error('删除失败：' + (response.ErrMsg || '未知错误'));
                }
            });
        },
        toggleSub(s) {
            this.subBusy = true;
            this.callPlugin('sub_toggle', {id: s.id, enabled: s.enabled ? 'false' : 'true'}, (response) => {
                this.subBusy = false;
                if (response.Result % 10000 == 0) {
                    this.$message({message: s.enabled ? '订阅已暂停' : '订阅已启用', type: 'success'});
                    this.loadSubs();
                } else {
                    this.$message.error('操作失败：' + (response.ErrMsg || '未知错误'));
                }
            });
        },
        updateSub(s) {
            this.subBusy = true;
            this.callPlugin('sub_update', {id: s.id}, (response) => {
                this.subBusy = false;
                if (response.Result % 10000 == 0) {
                    this.$message({message: '订阅已更新', type: 'success'});
                    this.loadSubs();
                } else {
                    this.$message.error('更新失败：' + (response.ErrMsg || '未知错误'));
                }
            });
        },
        showSubDetail(s) {
            if (this.subDetail && this.subDetail.id === s.id) {
                this.subDetail = null;
                return;
            }
            this.callPlugin('show', {TYPE: 'subdetail', id: s.id}, (response) => {
                if (response.Result % 10000 == 0 && response.Data) {
                    this.subDetail = {id: s.id, parsed: response.Data};
                    this.postSettings();
                } else {
                    this.$message.error('获取明细失败：' + (response.ErrMsg || '未知错误'));
                }
            });
        }
    }
});
</script>
</body>
</html>
